<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Generate Icons</title>
  <style>
    body { background: #111; color: #fff; font-family: sans-serif; padding: 40px; text-align: center; }
    canvas { border-radius: 20px; margin: 20px; }
    button {
      display: inline-block; margin: 10px; padding: 14px 28px;
      background: #f36f21; color: #fff; border: none;
      border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    p { color: #aaa; margin-top: 30px; font-size: 14px; }
  </style>
</head>
<body>

<h2 style="color:#f36f21">Ride Tracker — Icon Generator</h2>
<p style="color:#ccc">Click the buttons below to download your app icons.<br>Save both files into your <strong>cycling-tracker</strong> folder.</p>

<div>
  <canvas id="c192" width="192" height="192"></canvas>
  <canvas id="c512" width="512" height="512"></canvas>
</div>

<div>
  <button onclick="download(192)">⬇ Download icon-192.png</button>
  <button onclick="download(512)">⬇ Download icon-512.png</button>
</div>

<p>After downloading both files, place them in your <code>cycling-tracker</code> folder, then push to GitHub.</p>

<script>
  function drawIcon(canvas) {
    const size = canvas.width;
    const ctx  = canvas.getContext('2d');
    const s    = size / 512;   // scale factor

    // ── Background with rounded corners ──────────────────────
    const r = 110 * s;
    ctx.fillStyle = '#111111';
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.lineTo(size - r, 0); ctx.quadraticCurveTo(size, 0, size, r);
    ctx.lineTo(size, size - r); ctx.quadraticCurveTo(size, size, size - r, size);
    ctx.lineTo(r, size); ctx.quadraticCurveTo(0, size, 0, size - r);
    ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = '#f36f21';
    ctx.fillStyle   = '#f36f21';
    ctx.lineCap     = 'round';

    // ── Wheels ───────────────────────────────────────────────
    ctx.lineWidth = 20 * s;
    [[148, 348], [364, 348]].forEach(([cx, cy]) => {
      ctx.beginPath();
      ctx.arc(cx * s, cy * s, 92 * s, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx * s, cy * s, 11 * s, 0, Math.PI * 2);
      ctx.fill();
    });

    // ── Frame ────────────────────────────────────────────────
    ctx.lineWidth = 15 * s;
    [
      [148, 348, 258, 348],   // chain stay
      [148, 348, 216, 200],   // seat stay
      [258, 348, 216, 200],   // seat tube
      [216, 200, 334, 212],   // top tube
      [258, 348, 352, 278],   // down tube
      [352, 278, 364, 348],   // fork
      [216, 200, 216, 168],   // seat post
      [334, 212, 344, 182],   // stem
    ].forEach(([x1, y1, x2, y2]) => {
      ctx.beginPath();
      ctx.moveTo(x1 * s, y1 * s);
      ctx.lineTo(x2 * s, y2 * s);
      ctx.stroke();
    });

    // Head tube (slightly thicker)
    ctx.lineWidth = 18 * s;
    ctx.beginPath();
    ctx.moveTo(334 * s, 212 * s);
    ctx.lineTo(352 * s, 278 * s);
    ctx.stroke();

    // Saddle
    ctx.lineWidth = 16 * s;
    ctx.beginPath();
    ctx.moveTo(190 * s, 168 * s);
    ctx.lineTo(248 * s, 168 * s);
    ctx.stroke();

    // Handlebars
    ctx.beginPath();
    ctx.moveTo(324 * s, 182 * s);
    ctx.lineTo(368 * s, 182 * s);
    ctx.stroke();

    // Bottom bracket hub
    ctx.beginPath();
    ctx.arc(258 * s, 348 * s, 12 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  function download(size) {
    const canvas = document.getElementById('c' + size);
    const link   = document.createElement('a');
    link.download = 'icon-' + size + '.png';
    link.href     = canvas.toDataURL('image/png');
    link.click();
  }

  // Draw both previews on load
  drawIcon(document.getElementById('c192'));
  drawIcon(document.getElementById('c512'));
</script>
</body>
</html>
